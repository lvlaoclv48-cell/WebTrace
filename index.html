<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пр твари</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            font-weight: normal;
        }
        
        p {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        
        .telegram-bot {
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вы слишком поверили в себя.</h1>
        <p>Лучший поисковик <span class="telegram-bot">@faidiappsbot</span></p>
        <p>Ваши аккаунты на волоске ❤️</p>
    </div>
</body>
</html>
